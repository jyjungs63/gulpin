<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>어휘게임</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button type="button" class="back-btn">← 뒤로가기</button>
    <div id="cover" class="cover"><img alt="어휘게임 표지"></div>

    <main id="stage" class="stage">
        <div class="logo" aria-label="글핀"></div>
        <p class="progress"></p>
        <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div class="center-card"></div>
        <div class="cards"></div>
        <button type="button" class="next-btn"></button>
        <p class="notice"></p>
    </main>

    <script src="game.js"></script>
</body>

</html>
