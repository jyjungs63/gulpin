<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글핀 - 지점찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
  :root{
    --brand:#2fa45c;
    --brand-dark:#1f7a44;
    --brand2:#17924f;
    --ink:#1a1a1a;
    --ink-soft:#767676;
    --card-bg:#f5f5f5;
    --line:#dcdcdc;
    --naver:#03c75a;
    --radius-lg:14px;
    --content-w:660px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background:#fff;
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:1040px; margin:0 auto; padding:0 24px;}

  /* ---------- Header ---------- */
  header.site{border-bottom:1px solid #ececec;}
  .header-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 24px;
  }
  .logo-wrap img{height:34px; display:block;}
  .promo{display:flex; align-items:center; gap:12px;}
  .promo .promo-text{font-size:13px; color:var(--ink); text-align:right; line-height:1.4;}
  .promo .promo-text b{font-weight:700;}
  .promo .promo-text .arrow{color:var(--ink-soft);}
  .promo-badge{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#191919; color:#f5d000; border-radius:8px;
    padding:6px 10px; font-size:10.5px; font-weight:800; line-height:1.3; text-align:center;
    min-width:64px;
  }
  .promo-badge span:first-child{font-size:9px; color:#fff; font-weight:600;}

  nav.tabs{
    border-top:1px solid #ececec;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
  }
  .tabs-left{display:flex; align-items:center;}
  .tabs-right{display:flex; align-items:center; gap:16px;}
  nav.tabs a{
    position:relative;
    padding:18px 4px 16px;
    font-size:16px; font-weight:500; color:#444;
  }
  nav.tabs a.active{color:var(--ink); font-weight:700;}
  nav.tabs a.active::after{
    content:""; position:absolute; left:0; right:0; bottom:0;
    height:2px; background:var(--ink);
  }
  nav.tabs .home-link{color:var(--brand-dark); font-weight:700;}
  nav.tabs .home-link:hover{color:var(--brand);}
  .btn-register{
    display:flex; align-items:center; gap:6px;
    background:var(--brand); color:#fff; border:none;
    padding:10px 18px; border-radius:999px; font-weight:700; font-size:14.5px;
  }
  .btn-register:hover{background:var(--brand-dark);}
  .btn-register svg{width:15px;height:15px; stroke:#fff;}
  .hamburger{display:flex; flex-direction:column; gap:5px; padding:8px;}
  .hamburger span{width:22px; height:2px; background:var(--brand); display:block; border-radius:2px;}

  /* ---------- Hero ---------- */
  .hero{padding:56px 24px 0; text-align:center;}
  .hero h1{font-size:32px; font-weight:800; margin:0; color:var(--ink);}

  /* ---------- Search ---------- */
  .search-section{max-width:var(--content-w); margin:0 auto; padding:32px 24px 0;}
  .search-label{
    display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; margin-bottom:16px;
  }
  .search-icon{
    width:28px; height:28px; border-radius:50%; background:var(--brand);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .search-icon svg{width:14px;height:14px; stroke:#fff;}
  .select-row{display:flex; gap:16px; flex-wrap:wrap;}
  .select-wrap{position:relative; width:270px; max-width:100%;}
  .select-wrap select{
    width:100%; appearance:none; -webkit-appearance:none;
    padding:13px 38px 13px 16px;
    border:1.6px solid #222; border-radius:8px;
    font-size:15.5px; font-weight:600; color:var(--ink);
    background:#fff;
  }
  .select-wrap select:focus{outline:2px solid var(--brand); outline-offset:1px;}
  .select-wrap::after{
    content:""; position:absolute; right:15px; top:50%; translate:0 -50%;
    border:6px solid transparent; border-top-color:var(--brand); border-bottom:0;
    pointer-events:none;
  }

  .result-summary{max-width:var(--content-w); margin:0 auto; padding:26px 24px 0; font-size:18px; color:var(--ink);}
  .result-summary b{color:var(--brand); font-weight:800;}

  /* ---------- Result list ---------- */
  .result-list{max-width:var(--content-w); margin:0 auto; padding:20px 24px 70px; display:flex; flex-direction:column; gap:16px;}
  .center-card{
    background:var(--card-bg); border-radius:var(--radius-lg);
    padding:26px 28px;
    display:flex; flex-direction:column;
  }
  .card-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .center-card .info{flex:1; min-width:240px;}
  .center-card h3{margin:0 0 6px; font-size:20px; font-weight:800; color:var(--ink);}
  .center-card .desc{font-size:14px; color:var(--ink-soft); margin-bottom:14px;}
  .center-card .meta{display:flex; flex-direction:column; gap:7px; margin-bottom:2px;}
  .center-card .meta span{display:flex; align-items:center; gap:7px; font-size:14.5px; color:#444;}
  .center-card .meta svg{width:15px;height:15px; stroke:var(--ink-soft); flex:none;}

  .badge-btn{
    align-self:flex-start;
    font-size:13px; font-weight:600; color:#555;
    background:#ececec; border:none;
    padding:9px 16px; border-radius:999px; white-space:nowrap;
  }
  .badge-btn:hover{background:#e2e2e2;}

  /* 카드 폭 전체를 기준으로 정확히 가운데 정렬 (배지 컬럼에 영향받지 않도록 .info 밖으로 분리) */
  .card-buttons{display:flex; justify-content:center; gap:12px; width:100%; margin-top:20px;}
  .card-buttons a, .card-buttons button{
    flex:0 1 220px; text-align:center;
    padding:13px 10px; border-radius:9px; font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn-call{background:var(--brand); color:#fff;}
  .btn-call:hover{background:var(--brand-dark);}
  .btn-loc{background:#fff; color:var(--ink); border:1.6px solid #ddd;}
  .btn-loc:hover{border-color:var(--brand); color:var(--brand-dark);}
  .btn-delete{background:#fff; color:#d33; border:1.6px solid #f0bcbc; cursor:pointer;}
  .btn-delete:hover{background:#fff5f5; border-color:#d33;}
  .card-buttons svg{width:16px;height:16px; stroke:currentColor;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state svg{width:44px;height:44px; stroke:#ddd; margin-bottom:10px;}

  footer{border-top:1px solid #ececec; padding:24px; text-align:center; color:var(--ink-soft); font-size:12.5px;}

  /* ---------- Modal base (constrained to middle area, never full-screen) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,20,0.55);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff; border-radius:16px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    overflow:hidden; animation:pop .18s ease-out;
    max-height:88vh; display:flex; flex-direction:column;
  }
  @keyframes pop{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}

  .modal-dong{max-width:360px; text-align:center; padding:26px 24px 22px;}
  .modal-dong h4{margin:0 0 10px; font-size:16px; font-weight:800;}
  .modal-dong p{margin:0 0 18px; font-size:14px; color:var(--ink-soft); line-height:1.7;}
  .modal-dong button{
    width:100%; padding:13px; border-radius:10px; border:none;
    background:var(--brand); color:#fff; font-weight:700; font-size:14.5px;
  }

  /* ---- 위치보기 modal (첨부3 크기/버튼 기준) ---- */
  .modal-map{max-width:460px;}
  .modal-map .bar{
    background:var(--brand); color:#fff; padding:22px 26px; font-size:24px; font-weight:800;
    display:flex; align-items:center; justify-content:space-between; flex:none;
  }
  .modal-map .bar button{
    width:32px;height:32px;border-radius:50%; background:#fff; border:none; color:var(--brand);
    font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  /* 네이버지도는 정책상 자사 페이지의 iframe 삽입을 차단하므로(X-Frame-Options),
     실제 지도가 뜨지 않는 빈 화면 대신 클릭 시 네이버지도 새 탭으로 안전하게 연결되는
     프리뷰 카드를 보여줍니다. */
  .naver-map-area{
    position:relative; height:220px; flex:none; overflow:hidden;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 26px, rgba(3,199,90,0.08) 26px, rgba(3,199,90,0.08) 27px),
      repeating-linear-gradient(90deg, transparent, transparent 26px, rgba(3,199,90,0.08) 26px, rgba(3,199,90,0.08) 27px),
      #eef7f0;
  }
  .naver-map-area a.map-click{position:absolute; inset:0; display:block;}
  .naver-map-area .pin{
    position:absolute; left:50%; top:50%; translate:-50% -100%;
    display:flex; flex-direction:column; align-items:center; pointer-events:none;
  }
  .naver-map-area .pin .dot{
    width:34px;height:34px;border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--naver); border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center;
  }
  .naver-map-area .pin .dot svg{transform:rotate(45deg); width:14px;height:14px; stroke:#fff; fill:#fff;}
  .naver-map-area .pin .label{
    margin-top:5px; background:#fff; padding:3px 10px; border-radius:8px;
    font-size:12px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.14); white-space:nowrap;
  }
  .naver-overlay-btn{
    position:absolute; left:12px; bottom:12px; z-index:2; pointer-events:none;
    display:flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; font-size:12.5px; font-weight:700; color:var(--ink);
    box-shadow:0 4px 10px rgba(0,0,0,.12);
  }
  .naver-badge{
    width:18px;height:18px;border-radius:5px; background:var(--naver); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex:none;
  }
  .modal-map .body{padding:22px 26px 26px;}
  .modal-map .row{display:flex; align-items:flex-start; gap:8px; font-size:15px; margin-bottom:11px; color:#333;}
  .modal-map .row svg{width:17px;height:17px; stroke:var(--ink-soft); margin-top:2px; flex:none;}
  .modal-map .buttons{display:flex; gap:14px; margin-top:18px;}
  .modal-map .buttons a, .modal-map .buttons button{
    flex:1; padding:17px 10px; border-radius:9px; border:none; font-weight:800; font-size:17px;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .modal-map .buttons svg{width:18px;height:18px;}
  .modal-map .b-call{background:var(--brand); color:#fff;}
  .modal-map .b-call:hover{background:var(--brand-dark);}
  .modal-map .b-req{background:var(--brand2); color:#fff;}

  .modal-consult{max-width:380px; padding:24px 24px 22px;}
  .modal-consult h4{margin:0 0 4px; font-size:17px; font-weight:800;}
  .modal-consult .sub{font-size:13px; color:var(--ink-soft); margin-bottom:16px;}
  .modal-consult label{display:block; font-size:13px; font-weight:700; margin:12px 0 6px;}
  .modal-consult input{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:14px;}
  .modal-consult .send{
    width:100%; margin-top:18px; padding:13px; border:none; border-radius:9px;
    background:var(--brand2); color:#fff; font-weight:800; font-size:14.5px;
  }

  /* ---- 지점등록 modal ---- */
  .modal-register{
    width:min(960px, calc(100vw - 40px));
    height:min(820px, 92vh);
    min-width:420px;
    min-height:420px;
    max-width:calc(100vw - 40px);
    max-height:calc(100vh - 40px);
    resize:both;
  }
  .modal-register .bar{
    background:var(--brand); color:#fff; padding:18px 24px; font-size:19px; font-weight:800;
    display:flex; align-items:center; justify-content:space-between; flex:none;
    cursor:move; user-select:none; touch-action:none;
  }
  .modal-register.is-dragging{animation:none;}
  .modal-register.is-dragging .bar{cursor:grabbing;}
  .modal-register .bar button{
    width:30px;height:30px;border-radius:50%; background:#fff; border:none; color:var(--brand);
    font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .modal-register .body{padding:22px 24px 24px; overflow-y:auto;}

  .addr-search-row{display:flex; gap:8px;}
  .addr-search-row input{flex:1;}
  .btn-postcode{
    flex:none; background:var(--brand); color:#fff; border:none; border-radius:8px;
    padding:0 16px; font-weight:700; font-size:13.5px; white-space:nowrap;
  }
  .btn-postcode:hover{background:var(--brand-dark);}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; margin-top:16px;}
  .form-grid .full{grid-column:1 / -1;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input{
    width:100%; padding:11px 12px; border:1.4px solid var(--line); border-radius:8px;
    font-size:14px; color:var(--ink); background:#fff;
  }
  .field input:focus{outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand);}
  .field input[readonly]{background:#f7f7f7; color:#666;}

  .register-actions{display:flex; align-items:center; gap:10px; margin-top:18px;}
  .btn-save{background:var(--brand); color:#fff; border:none; padding:12px 22px; border-radius:8px; font-weight:700; font-size:14.5px;}
  .btn-save:hover{background:var(--brand-dark);}
  .btn-cancel{background:#fff; color:var(--ink-soft); border:1.4px solid var(--line); padding:12px 18px; border-radius:8px; font-weight:700; font-size:14.5px;}
  .editing-flag{font-size:12.5px; color:var(--brand); font-weight:700; display:none;}
  .editing-flag.show{display:inline-block;}

  .register-list{margin-top:22px; border-top:1px dashed var(--line); padding-top:16px;}
  .register-list-head{font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:8px;}
  .admin-table{width:100%; border-collapse:collapse; font-size:13px;}
  .admin-table th, .admin-table td{text-align:left; padding:9px 10px; border-bottom:1px solid #eee; white-space:nowrap;}
  .admin-table th{color:var(--ink-soft); font-weight:700; font-size:12px;}
  .admin-table td.addr{white-space:nowrap; max-width:none;}
  .admin-table .row-actions{display:flex; gap:6px;}
  .admin-table .row-actions button{border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 9px; font-size:12px; font-weight:600;}
  .admin-table .row-actions .del{color:#d33; border-color:#f3c8c8;}
  .admin-table-scroll{max-height:190px; overflow:auto; border:1px solid var(--line); border-radius:8px;}

  .toast{
    position:fixed; left:50%; bottom:30px; translate:-50% 0;
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s, translate .25s;
    z-index:200;
  }
  .toast.show{opacity:1; translate:-50% -8px;}

  @media (max-width:640px){
    .header-inner{flex-wrap:wrap; gap:10px;}
    .select-wrap{width:100%;}
    .form-grid{grid-template-columns:1fr;}
    .center-card{padding:20px;}
    .card-buttons a, .card-buttons button{flex:1 1 auto;}
    .modal-register{
      width:100%; height:auto; min-width:0; min-height:0;
      max-width:100%; max-height:88vh; resize:none; transform:none !important;
    }
    .modal-register .bar{cursor:default; touch-action:auto;}
    .modal-register .body{padding:14px 12px 16px;}
    .admin-table{width:max-content; min-width:100%; font-size:11px;}
    .admin-table th, .admin-table td{padding:7px 6px;}
    .admin-table td.addr{max-width:180px; overflow:hidden; text-overflow:ellipsis; font-size:10px;}
    .admin-table .row-actions{gap:3px;}
    .admin-table .row-actions button{padding:4px 6px; font-size:10px;}
  }
</style>
</head>

let centersData = JSON.parse(JSON.stringify(DEFAULT_DATA));

const STORAGE_KEY = 'geulpin-centers-data';
const BRANCH_API_URL = 'Server/branch_api.php';
function isAdminUser(){
  try{
    const loginInfo = JSON.parse(localStorage.getItem('infochaitalk'));
    const role = String(loginInfo?.role ?? '');
    const user = String(loginInfo?.user ?? '').trim().toLowerCase();
    return role === '9' || user === 'chaitalk';
  }catch(error){
    return false;
  }
}
async function loadFromStorage(){
  try{
    const response = await fetch(BRANCH_API_URL, {cache:'no-store'});
    if(!response.ok) throw new Error('branch database unavailable');
    const payload = await response.json();
    if(payload.data && Object.keys(payload.data).length){
      centersData = payload.data;
    }else{
      await saveToStorage();
    }
  }catch(e){
    try{
      if(window.storage && window.storage.get){
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value) centersData = JSON.parse(res.value);
      }
    }catch(storageError){ /* no persisted data yet, or storage unavailable — use defaults */ }
  }
  initSido();
  renderAdminTable();
}
async function saveToStorage(){
  try{
    const response = await fetch(BRANCH_API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data:centersData})
    });
    if(!response.ok) throw new Error('branch database unavailable');
    return;
  }catch(e){
    try{
      if(window.storage && window.storage.set) await window.storage.set(STORAGE_KEY, JSON.stringify(centersData));
    }catch(storageError){ /* storage unavailable — data stays in-memory for this session */ }
    }
}

const sidoSelect = document.getElementById('sido');
const gugunSelect = document.getElementById('gugun');
const resultSummary = document.getElementById('resultSummary');
const resultList = document.getElementById('resultList');
let sidoRequestId = 0;

function initSido(){
  const prevSido = sidoSelect.value;
  sidoSelect.innerHTML = '';
  Object.keys(centersData).forEach(sido=>{
    const opt = document.createElement('option');
    opt.value = sido; opt.textContent = sido;
    sidoSelect.appendChild(opt);
  });
  sidoSelect.value = Object.keys(centersData).includes(prevSido) ? prevSido : Object.keys(centersData)[0];
  onSidoChange();
}
async function onSidoChange(){
  const sido = sidoSelect.value;
  const prevGugun = gugunSelect.value;
  gugunSelect.innerHTML = '<option value="">시/군/구 선택</option>';
  const requestId = ++sidoRequestId;
  resultList.innerHTML = '<div class="empty-state">지점 정보를 조회 중입니다.</div>';

  try{
    const response = await fetch(BRANCH_API_URL + '?sido=' + encodeURIComponent(sido), {cache:'no-store'});
    if(!response.ok) throw new Error('branch database unavailable');
    const payload = await response.json();
    if(requestId !== sidoRequestId) return;
    centersData[sido] = payload.data && payload.data[sido] ? payload.data[sido] : {};
  }catch(e){
    if(requestId !== sidoRequestId) return;
    showToast('지점 정보를 불러오지 못했습니다.');
    centersData[sido] = {};
  }

  Object.keys(centersData[sido] || {}).forEach(gu=>{
    const opt = document.createElement('option');
    opt.value = gu; opt.textContent = gu;
    gugunSelect.appendChild(opt);
  });
  if(Object.keys(centersData[sido] || {}).includes(prevGugun)) gugunSelect.value = prevGugun;
  renderResults();
}
function onGugunChange(){ renderResults(); }

function collectCenters(sido, gugun){
  const guData = centersData[sido] || {};
  let list = [];
  if(gugun){
    (guData[gugun] || []).forEach((c, centerIndex)=> list.push(Object.assign({gu:gugun, centerIndex}, c)));
  }else{
    Object.keys(guData).forEach(gu=> guData[gu].forEach((c, centerIndex)=> list.push(Object.assign({gu, centerIndex}, c))));
  }
  return list;
}

function renderResults(){
  const sido = sidoSelect.value;
  const gugun = gugunSelect.value;
  const list = collectCenters(sido, gugun);
  const scopeLabel = gugun ? (sido + ' ' + gugun) : sido;
  resultSummary.innerHTML = `<b>${scopeLabel}</b> 에 <b>${list.length}개</b>의 글핀 지점가 검색되었습니다.`;

  resultList.innerHTML = '';
  if(list.length === 0){
    resultList.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

    return;

    const card = document.createElement('div');
    card.className = 'center-card';

              ${c.address}
            </span>
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.8 2.1z"/></svg>
              ${c.phone}
            </span>
          </div>
        </div>
        <button class="badge-btn" type="button" onclick="openDong(${idx})">세부지역 안내</button>
      </div>
      <div class="card-buttons">
        <a class="btn-call" href="tel:${c.phone.replace(/-/g,'')}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.8 2.1z"/></svg>
          전화연결
        </a>
        <a class="btn-loc" href="#" onclick="openMap(${idx}); return false;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          위치보기
        </a>
        ${isAdminUser() ? `<button class="btn-delete" type="button" onclick="deleteResultCenter(${idx})">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6m3 0V4h8v2m-6 4v6m4-6v6"/></svg>
          삭제
        </button>` : ''}
      </div>
    `;
    resultList.appendChild(card);
  });
  window.__currentList = list;
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{
    if(e.target === ov && ov.id !== 'registerOverlay') closeModal(ov.id);
  });

/* 지점 등록 모달: 제목 표시줄 드래그 이동 */
const registerModal = document.querySelector('#registerOverlay .modal-register');
const registerModalBar = registerModal.querySelector('.bar');
let registerDrag = null;

registerModalBar.addEventListener('pointerdown', event=>{
  if(event.button !== 0 || event.target.closest('button') || window.innerWidth <= 640) return;
  const rect = registerModal.getBoundingClientRect();
  registerDrag = {
    pointerId:event.pointerId,
    startX:event.clientX,
    startY:event.clientY,
    translateX:Number(registerModal.dataset.translateX || 0),
    translateY:Number(registerModal.dataset.translateY || 0),
    minX:20 - rect.left,
    maxX:window.innerWidth - 20 - rect.right,
    minY:20 - rect.top,
    maxY:window.innerHeight - 20 - rect.bottom
  };
  registerModal.classList.add('is-dragging');
  registerModalBar.setPointerCapture(event.pointerId);
});

registerModalBar.addEventListener('pointermove', event=>{
  if(!registerDrag || event.pointerId !== registerDrag.pointerId) return;
  const offsetX = Math.min(registerDrag.maxX, Math.max(registerDrag.minX, event.clientX - registerDrag.startX));
  const offsetY = Math.min(registerDrag.maxY, Math.max(registerDrag.minY, event.clientY - registerDrag.startY));
  const translateX = registerDrag.translateX + offsetX;
  const translateY = registerDrag.translateY + offsetY;
  registerModal.dataset.translateX = translateX;
  registerModal.dataset.translateY = translateY;
  registerModal.style.transform = `translate(${translateX}px, ${translateY}px)`;
});

function endRegisterDrag(event){
  if(!registerDrag || event.pointerId !== registerDrag.pointerId) return;
  registerDrag = null;
  registerModal.classList.remove('is-dragging');
}
registerModalBar.addEventListener('pointerup', endRegisterDrag);
registerModalBar.addEventListener('pointercancel', endRegisterDrag);

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ---------------- 지점등록 (Daum/Kakao 우편번호 서비스) ---------------- */
function openRegister(){
  resetForm();
  openModal('registerOverlay');
  renderAdminTable();
}

// 서울/광역시/도 등 시·도 명칭 뒤에 오는 접미사로 주소 문자열에서 시/도, 시/군/구를 추정하는 보조 파서
// (Daum 응답에 sido/sigungu 값이 비어 오는 예외적인 경우를 대비한 안전장치)
function parseAddressRegion(address){
  if(!address) return {sido:'', gugun:''};
  const tokens = address.trim().split(/\s+/);
  const sidoTok = tokens[0] || '';
  const guTok = tokens[1] || '';
  const sido = /(특별시|광역시|특별자치시|특별자치도|도)$/.test(sidoTok) ? sidoTok : sidoTok;
  const gugun = /(시|군|구)$/.test(guTok) ? guTok : guTok;
  return {sido, gugun};
}

// 주소 검색 (Kakao 우편번호 서비스)
// 페이지 내부에 iframe으로 끼워 넣는 방식(embed)은 중첩된 미리보기/샌드박스 환경에서
// 결과 선택 메시지가 부모 페이지로 전달되지 않는 경우가 있어,
// 실제 브라우저 팝업창(window.open)을 여는 .open() 방식을 사용합니다.
// -> 창 크기를 500x600으로 고정해 화면 전체가 아닌 중간 크기로만 뜨고,
//    선택 즉시 콜백이 바로 이 페이지의 자바스크립트를 호출해 입력칸을 채웁니다.
function openPostcode(){
  if(!(window.daum && window.daum.Postcode)){
    showToast('주소 검색 서비스를 불러오지 못했습니다. 네트워크 연결을 확인하거나 잠시 후 다시 시도해 주세요.');
    return;
  }
  const w = 500, h = 600;
  const left = Math.max(0, (window.screen.width - w) / 2);
  const top = Math.max(0, (window.screen.height - h) / 2);

  const postcode = new daum.Postcode({
    oncomplete: function(data){
      const roadAddr = data.roadAddress || data.jibunAddress || '';
      let sido = data.sido || '';
      let gugun = data.sigungu || '';
      if(!sido || !gugun){
        const guessed = parseAddressRegion(roadAddr);
        sido = sido || guessed.sido;
        gugun = gugun || guessed.gugun;
      }
      document.getElementById('fAddress').value = roadAddr;
      document.getElementById('fZip').value = data.zonecode || '';
      document.getElementById('fSido').value = sido;
      document.getElementById('fGugun').value = gugun;
      document.getElementById('fAddressDetail').focus();
      showToast('주소와 우편번호가 자동으로 채워졌습니다.');
    },
    width: '100%',
    height: '100%'
  });

  const opened = postcode.open({
    left: left,
    top: top,
    popupTitle: '주소 검색 (Kakao)',
    popupKey: 'geulpinAddressPopup'
  });

  // 팝업이 브라우저 팝업 차단 등으로 열리지 못한 경우를 대비한 안내
  setTimeout(function(){
    if(opened === false){
      showToast('팝업이 차단되었습니다. 브라우저의 팝업 차단을 해제한 뒤 다시 시도해 주세요.');
    }
  }, 300);
}

let editingRef = null;
function resetForm(){
  editingRef = null;
  ['fSido','fGugun','fName','fArea','fDong','fAddress','fAddressDetail','fPhone','fZip'].forEach(id=>{
    document.getElementById(id).value = '';
  });
  document.getElementById('editingFlag').classList.remove('show');
}

function saveCenter(){
  const sido = document.getElementById('fSido').value.trim();
  const gugun = document.getElementById('fGugun').value.trim();
  const name = document.getElementById('fName').value.trim();
  const area = document.getElementById('fArea').value.trim();
  const dong = document.getElementById('fDong').value.trim();
  const roadAddr = document.getElementById('fAddress').value.trim();
  const detail = document.getElementById('fAddressDetail').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const address = detail ? (roadAddr + ' ' + detail) : roadAddr;

  if(!sido || !gugun || !name || !roadAddr || !phone){
    showToast('주소검색, 지부명, 전화번호는 필수입니다.');
    return;
  }

  const record = { name, area, dong, address, phone };

  if(editingRef){
    const old = centersData[editingRef.sido][editingRef.gu];
    old.splice(editingRef.index, 1);
    if(old.length === 0) delete centersData[editingRef.sido][editingRef.gu];
    if(Object.keys(centersData[editingRef.sido]).length === 0) delete centersData[editingRef.sido];
  }
  if(!centersData[sido]) centersData[sido] = {};
  if(!centersData[sido][gugun]) centersData[sido][gugun] = [];
  centersData[sido][gugun].push(record);

  saveToStorage();
  initSido();
  sidoSelect.value = sido; onSidoChange();
  gugunSelect.value = gugun; renderResults();
  renderAdminTable();
  resetForm();
  showToast('저장되었습니다. 검색 결과에 반영되었습니다.');
}

function editCenter(sido, gu, index){
  const c = centersData[sido][gu][index];
  document.getElementById('fSido').value = sido;
  document.getElementById('fGugun').value = gu;
  document.getElementById('fName').value = c.name;
  document.getElementById('fArea').value = c.area;
  document.getElementById('fDong').value = c.dong;
  document.getElementById('fAddress').value = c.address;
  document.getElementById('fAddressDetail').value = '';
  document.getElementById('fPhone').value = c.phone;
  editingRef = {sido, gu, index};
  document.getElementById('editingFlag').classList.add('show');
}
function deleteCenter(sido, gu, index){
  if(!isAdminUser()){
    showToast('관리자만 지점을 삭제할 수 있습니다.');
    return;
  }
  if(!confirm('이 지점을 삭제할까요?')) return;
  centersData[sido][gu].splice(index, 1);
  if(centersData[sido][gu].length === 0) delete centersData[sido][gu];
  if(Object.keys(centersData[sido]).length === 0) delete centersData[sido];
  saveToStorage();
  initSido();
  renderResults();
  renderAdminTable();
  showToast('삭제되었습니다.');
}
function deleteResultCenter(listIndex){
  const center = (window.__currentList || [])[listIndex];
  if(!center) return;
  deleteCenter(sidoSelect.value, center.gu, center.centerIndex);
}
function renderAdminTable(){
  const tbody = document.getElementById('adminTableBody');
  tbody.innerHTML = '';
  let count = 0;
  Object.keys(centersData).forEach(sido=>{
    Object.keys(centersData[sido]).forEach(gu=>{
      centersData[sido][gu].forEach((c, index)=>{
        count++;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${c.name}</td><td>${sido} ${gu}</td><td class="addr">${c.address}</td><td>${c.phone}</td>
          <td class="row-actions">
            <button onclick="editCenter('${sido}','${gu}',${index})">수정</button>
            ${isAdminUser() ? `<button class="del" onclick="deleteCenter('${sido}','${gu}',${index})">삭제</button>` : ''}
          </td>`;
        tbody.appendChild(tr);
      });
    });
  });
  document.getElementById('adminListHead').textContent = `등록된 지점 (${count})`;
}

sidoSelect.addEventListener('change', onSidoChange);
gugunSelect.addEventListener('change', onGugunChange);

loadFromStorage();
</script>
