<script>
const passages = {
  p1: `여름 낮에 아스팔트는 햇빛의 에너지를 많이 <strong>흡수</strong>해 뜨거워집니다. 밤이 되어도 저장한 열을 천천히 내보내기 때문에 도심의 기온은 쉽게 내려가지 않습니다.<br><br>나무는 잎으로 햇빛의 일부를 가리고, 뿌리로 빨아들인 물을 잎에서 수증기로 내보냅니다. 물이 수증기로 바뀔 때 주변의 열을 사용하므로 공기가 조금 식습니다.<br><br>따라서 가로수가 충분히 자라고 물도 알맞게 공급되면, 나무는 도심의 온도 상승을 <strong>완화</strong>하는 데 도움을 줍니다. 그러나 어린 나무 몇 그루를 심는 것만으로 넓은 지역의 온도가 곧바로 크게 낮아지는 것은 아닙니다.`,
  p2: `마을 주민센터는 갑자기 비가 내릴 때 주민 누구나 우산을 빌려 쓸 수 있도록 마을 곳곳에 '공공 우산함'을 설치했습니다. 처음에는 별도의 기록 없이 자유롭게 우산을 빌릴 수 있도록 운영했습니다.<br><br>그러나 일부 이용자가 여러 개의 우산을 한꺼번에 빌린 뒤 오랫동안 반납하지 않았습니다. 이처럼 우산을 장기간 <strong>점유</strong>하는 사람이 생기자, 정작 비가 오는 날 우산이 필요한 사람들이 빌리지 못하는 일이 생겼습니다.<br><br>이에 주민센터는 우산마다 번호를 붙이고, 빌린 날짜를 기록하도록 대여 방식을 바꾸었습니다. 또한 빌린 우산은 사흘 안에 마을의 어느 공공 우산함에나 반납하도록 규칙을 정했습니다.`,
  p3: `인쇄술이 발달하기 전에는 책 한 권을 만들기 위해 글을 손으로 베껴 써야 했습니다. 이 방법은 시간이 오래 걸렸고, 베끼는 과정에서 글자가 빠지거나 바뀌기도 했습니다.<br><br>금속 활자는 글자 하나하나를 금속으로 만들어 필요한 문장대로 배열한 뒤, 먹을 묻혀 종이에 찍는 도구입니다. 인쇄가 끝나면 활자를 다시 풀어 다른 글을 찍는 데 사용할 수 있습니다.<br><br>이처럼 같은 활자를 되풀이해 쓸 수 있게 되자 책을 여러 권 만드는 시간이 줄었고, 지식도 더 널리 <strong>보급</strong>될 수 있었습니다. 다만 활자를 만들고 정확히 배열하려면 <strong>숙련된</strong> 기술이 필요했습니다.`,
  p4: `철새는 계절에 따라 먼 거리를 이동합니다. 일부 철새는 해와 별의 위치뿐 아니라 지구의 자기장도 감지하여 방향을 찾는 것으로 알려져 있습니다.<br><br>연구자들은 둥근 우리 안에 철새를 넣고 다른 조건은 그대로 둔 채, 자기장의 방향만 바꾸었습니다. 그러자 철새가 몸을 돌리는 방향도 달라졌습니다. 이 결과는 철새가 자기장을 이동의 단서로 이용한다는 설명을 뒷받침합니다.<br><br>그러나 밤의 강한 인공조명이나 전자 기기의 신호가 철새의 길 찾기를 <strong>교란</strong>할 수 있습니다. 철새는 한 가지 단서만 사용하는 것이 아니라 여러 단서를 함께 이용하기 때문입니다.`,
  p5: `한 학급에서 음식물 쓰레기가 분해되는 조건을 알아보기 위해 같은 양의 바나나 껍질을 세 용기에 넣었습니다.
  <table>
    <tr><th>용기</th><th>조건</th><th>2주 뒤의 모습</th></tr>
    <tr><td>A</td><td>뚜껑을 빈틈없이 닫음</td><td>부피가 조금 줄고 심한 냄새가 남</td></tr>
    <tr><td>B</td><td>공기구멍을 내고 마른 잎을 섞음</td><td>부피가 가장 많이 줄고 흙과 비슷한 냄새가 남</td></tr>
    <tr><td>C</td><td>공기구멍을 내고 매일 많은 물을 부음</td><td>물컹해지고 심한 냄새가 남</td></tr>
  </table>
  <br>미생물과 같은 분해자는 알맞은 공기와 수분이 있을 때 활발하게 활동합니다. 물이 지나치게 많으면 재료 사이의 빈틈이 물로 채워져 공기가 잘 통하지 않을 수 있습니다.`
};

const rawData = [
  { q:"다음 중 '관찰'의 뜻으로 가장 알맞은 것은 무엇일까요?", passage:null, area:"문맥 어휘",
    options:["앞으로 일어날 일을 미리 생각하는 것","대상의 특징이나 변화를 자세히 살펴보는 것","실험 결과를 다른 사람에게 설명하는 것","여러 대상을 일정한 기준으로 나누는 것","어떤 현상의 까닭을 이리저리 따져 생각하는 것"],
    answer:"대상의 특징이나 변화를 자세히 살펴보는 것",
    explain:"'관찰'은 대상의 모습이나 변화를 주의 깊게 눈여겨보는 것을 뜻합니다." },
  { q:"'분포(分布)'의 뜻으로 가장 알맞은 것은 무엇일까요?", passage:null, area:"한자어 추론",
    options:["일정한 지역에 여러 대상이 나뉘어 퍼져 있는 상태","여러 지역의 대상을 한곳으로 옮기는 과정","지역의 크기를 정확하게 측정하는 방법","서로 다른 지역을 하나로 합치는 활동","한곳에 모여 집중적으로 뭉쳐 있는 상태"],
    answer:"일정한 지역에 여러 대상이 나뉘어 퍼져 있는 상태",
    explain:"'분포'는 나누어 흩어져 바탕을 이루거나 퍼져 있는 상태를 뜻합니다." },

function circledNum(i) {
  const nums = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  return nums[i] || (i + 1) + '.';
}
function shuffleArray(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const TOTAL = 15;
let userAnswers = {};
let questionStatus = {};
let currentQuestions = [];
let currentGroups = [];
let currentFilter = 'all';

function buildGroups(data) {
  const groups = [];
  const groupMap = new Map();
  data.forEach(q => {
    if (q.passage) {
      if (!groupMap.has(q.passage)) {
        const g = { passage: q.passage, questions: [] };
        groupMap.set(q.passage, g);
        groups.push(g);
      }
      groupMap.get(q.passage).questions.push(q);
    } else {
      groups.push({ passage: null, questions: [q] });
    }
  });
  return groups;
}

function initTest() {
  const groups = buildGroups(rawData);
  currentGroups = shuffleArray(groups).map(g => ({ passage: g.passage, questions: shuffleArray(g.questions) }));
  currentQuestions = [];
  currentGroups.forEach(g => g.questions.forEach(q => currentQuestions.push(q)));
  userAnswers = {};
  questionStatus = {};
  currentFilter = 'all';
  renderQuestions();
}

function renderQuestions() {
  const container = document.getElementById('questions-A');
  container.innerHTML = '';
  let idx = 0;
  currentGroups.forEach(g => {
    let target = container;
    if (g.passage) {
      const startNum = idx + 1;
      const endNum = idx + g.questions.length;
      const rangeLabel = g.questions.length > 1 ? `[${startNum}~${endNum}]` : `[${startNum}]`;
      const groupDiv = document.createElement('div');
      groupDiv.className = 'passage-group';
      groupDiv.innerHTML = `<div class="passage-range-label">${rangeLabel} 다음 글을 읽고 물음에 답하세요.</div><div class="passage-box">${g.passage}</div>`;
      container.appendChild(groupDiv);
      target = groupDiv;
    }
    g.questions.forEach(q => {
      const index = idx++;
      const div = document.createElement('div');
      div.className = 'question-card';
      div.dataset.index = index;
      div.dataset.status = questionStatus[index] || 'unanswered';

      const opts = shuffleArray(q.options);

      div.innerHTML = `
        <div class="question-header">
          <div class="question-number">${index + 1}.</div>
          <div class="question-text">${q.q}</div>
        </div>
        <div class="options">
          ${opts.map((opt, oi) => `
            <label class="option-row" data-value="${opt.replace(/"/g,'&quot;')}">
              <input type="radio" name="q-A-${index}" value="${opt.replace(/"/g,'&quot;')}" onchange="selectOption(${index}, this)">
              <span class="option-text">${circledNum(oi)} ${opt}</span>
            </label>`).join('')}
        </div>
        <div class="hint-section" id="hint-${index}">
          <div class="hint-title">💡 힌트 (영역: ${q.area})</div>
          <div class="hint-content">
            <div><strong>설명:</strong> ${q.explain}</div>
            <div class="hint-answer"><strong>정답:</strong> ${q.answer}</div>
          </div>
        </div>
      `;
      target.appendChild(div);
    });
  });
  applyFilter();
  updateProgress();
}

function selectOption(index, el) {
  const card = el.closest('.question-card');
  card.querySelectorAll('.option-row').forEach(o => o.classList.remove('selected'));
  const row = el.closest('.option-row');
  row.classList.add('selected');
  userAnswers[index] = el.value;
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).filter(k => userAnswers[k]).length;
  document.getElementById('progressA').textContent = `${answered} / ${TOTAL} 문제 완료`;
}

function checkAnswers() {
  let correctCount = 0;
  let wrongQuestions = [];
  const areaStats = {};
  AREA_ORDER.forEach(a => areaStats[a] = { correct:0, total:0 });

  const cards = document.querySelectorAll('#questions-A .question-card');

  cards.forEach((card, index) => {
    const q = currentQuestions[index];
    const correctAnswer = q.answer;
    const userAnswer = userAnswers[index];
    areaStats[q.area].total++;

    if (questionStatus[index] === 'correct') {
      correctCount++;
      areaStats[q.area].correct++;
      return;
    }

    const opts = card.querySelectorAll('.option-row');
    opts.forEach(opt => {
      opt.classList.add('disabled');
      opt.querySelector('input[type="radio"]').disabled = true;
      const optText = opt.dataset.value;
      if (optText === correctAnswer) opt.classList.add('correct');
      if (optText === userAnswer && userAnswer !== correctAnswer) opt.classList.add('incorrect');
    });

    if (userAnswer === correctAnswer) {
      correctCount++;
      areaStats[q.area].correct++;
      questionStatus[index] = 'correct';
      card.dataset.status = 'correct';
      card.classList.add('correct-card');
    } else {
      questionStatus[index] = 'wrong';
      card.dataset.status = 'wrong';
      card.classList.add('wrong');
      wrongQuestions.push(index);

      const hintBtn = document.createElement('button');
      hintBtn.className = 'hint-btn';
      hintBtn.textContent = '💡 힌트 보기';
      hintBtn.onclick = () => toggleHint(index);
      card.appendChild(hintBtn);
    }
  });

  const percentage = Math.round((correctCount / TOTAL) * 100);
  const diag = getDiagnosis(correctCount);
  const resultDiv = document.getElementById('result-A');

  let areaHtml = '';
  AREA_ORDER.forEach(area => {
    const st = areaStats[area];
    if (st.total === 0) return;
    const rate = st.correct / st.total;
    const isLow = rate < 0.6;
    const pct = Math.round(rate * 100);
    const comment = isLow ? areaComments[area] : areaGoodComments[area];
    areaHtml += `
      <div class="area-row">
        <div class="area-row-head">
          <span class="area-name">${area}</span>
          <span class="area-score ${isLow ? 'low':''}">${st.correct} / ${st.total} (${pct}%)</span>
        </div>
        <div class="area-bar-bg"><div class="area-bar-fill ${isLow?'low':''}" style="width:${pct}%;"></div></div>
        <div class="area-comment">${comment}</div>
      </div>`;
  });

  resultDiv.innerHTML = `
    <h3>🎉 결과</h3>
    <p>맞힌 문제: ${correctCount} / ${TOTAL}</p>
    <p>정답률: ${percentage}%</p>
    <div class="diagnosis-card">
      <div class="diagnosis-title">📊 총점 진단 : ${correctCount}점 · ${diag.title}</div>
      <div class="diagnosis-desc">${diag.desc}</div>
    </div>
    <div class="area-report">
      <div class="area-report-title">🗂️ 영역별 상담 결과</div>
      ${areaHtml}
    </div>
  `;
  resultDiv.classList.add('show');

  event.target.style.display = 'none';

  if (wrongQuestions.length > 0) {
    document.querySelector('.retry-btn').style.display = 'inline-block';
    document.getElementById('filterA').classList.add('show');
  }
}

function toggleHint(index) {
  const h = document.getElementById(`hint-${index}`);
  h.classList.toggle('show');
}

function retryWrong() {
  const cards = document.querySelectorAll('#questions-A .question-card');
  cards.forEach((card, index) => {
    if (questionStatus[index] === 'wrong') {
      card.classList.remove('wrong');
      const h = document.getElementById(`hint-${index}`);
      if (h) h.classList.remove('show');
      const hb = card.querySelector('.hint-btn');
      if (hb) hb.remove();
      const opts = card.querySelectorAll('.option-row');
      opts.forEach(o => {
        o.classList.remove('selected','correct','incorrect','disabled');
        const input = o.querySelector('input[type="radio"]');
        input.disabled = false;
        input.checked = false;
      });
      userAnswers[index] = '';
      questionStatus[index] = 'retry';
    }
  });

  document.getElementById('result-A').classList.remove('show');
  document.querySelector('.submit-btn').style.display = 'inline-block';
  event.target.style.display = 'none';
  filterQuestions('wrong');
}

function filterQuestions(filter) {
  currentFilter = filter;
  document.querySelectorAll('#filterA .filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyFilter();
}

function applyFilter() {
  const cards = document.querySelectorAll('#questions-A .question-card');
  cards.forEach((card, index) => {
    if (currentFilter === 'all') {
      card.style.display = 'block';
    } else {
      card.style.display = (questionStatus[index] === 'wrong' || questionStatus[index] === 'retry') ? 'block' : 'none';
    }
  });
  document.querySelectorAll('#questions-A .passage-group').forEach(group => {
    const anyVisible = Array.from(group.querySelectorAll('.question-card')).some(c => c.style.display !== 'none');
    group.style.display = anyVisible ? 'block' : 'none';
  });
}

function resetTest() {
  initTest();
  const resultDiv = document.getElementById('result-A');
  resultDiv.classList.remove('show');
  resultDiv.innerHTML = '';
  document.querySelector('.submit-btn').style.display = 'inline-block';
  document.querySelector('.retry-btn').style.display = 'none';
  const filterDiv = document.getElementById('filterA');
  filterDiv.classList.remove('show');
  const fbtns = filterDiv.querySelectorAll('.filter-btn');
  fbtns.forEach(b => b.classList.remove('active'));
  fbtns[0].classList.add('active');
}

window.onload = initTest;
</script>
</body>
</html>
